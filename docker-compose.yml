services:
  api:
    build: .
    env_file: [ .env, .env.local ]
    environment:
      DATABASE_URL: postgres://nexus:nexus@db:5432/nexus
      REDIS_URL: redis://redis:6379
      EXTRACTOR_URL: http://extractor:8000
      ARTIFACT_STORAGE_DIR: /data/artifacts
      MCP_OAUTH_CALLBACK_URL: ${MCP_OAUTH_CALLBACK_URL:-http://localhost:3002/v1/mcp/oauth/callback}
      MCP_APP_URL: ${MCP_APP_URL:-http://localhost:3002}
    ports: ["3001:3001"]
    volumes: ["artifact_data:/data/artifacts"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      extractor: { condition: service_healthy }
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: [ .env, .env.local ]
    environment:
      DATABASE_URL: postgres://nexus:nexus@db:5432/nexus
      REDIS_URL: redis://redis:6379
      EXTRACTOR_URL: http://extractor:8000
      ARTIFACT_STORAGE_DIR: /data/artifacts
      MCP_OAUTH_CALLBACK_URL: ${MCP_OAUTH_CALLBACK_URL:-http://localhost:3002/v1/mcp/oauth/callback}
      MCP_APP_URL: ${MCP_APP_URL:-http://localhost:3002}
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      extractor: { condition: service_healthy }
    volumes: ["artifact_data:/data/artifacts"]
  migrate:
    build: .
    command: ["node", "dist/db/migrate.js"]
    env_file: [ .env, .env.local ]
    environment:
      DATABASE_URL: postgres://nexus:nexus@db:5432/nexus
    depends_on:
      db: { condition: service_healthy }
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  extractor:
    build: ./services/extractor
    environment:
      EXTRACTOR_TOKEN: ${EXTRACTOR_TOKEN:-change-me}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  web-stitch:
    build:
      context: ./web-stitch
      args:
        VITE_API_URL: ""
    ports: ["3002:80"]
    depends_on:
      - api
volumes:
  postgres_data:
  artifact_data:
