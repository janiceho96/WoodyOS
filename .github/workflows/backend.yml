name: Backend checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: a-development-secret-that-is-at-least-32-characters
      ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      RUN_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: docker build -t ai-nexus-extractor ./services/extractor
      - run: |
          docker run -d --name ai-nexus-extractor -p 8000:8000 ai-nexus-extractor
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs ai-nexus-extractor
          exit 1
      - run: npm test
      - run: docker build -t ai-nexus-api .
