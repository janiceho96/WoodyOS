server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_backend http://api:3001;
  root /usr/share/nginx/html;
  index index.html;

  # Complex plans generated by reasoning models can legitimately take longer
  # than Nginx's 60-second default. Keep the exception scoped to compilation.
  location = /v1/agent-solutions/compile {
    proxy_pass $api_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /v1/ {
    proxy_pass $api_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health {
    proxy_pass $api_backend;
  }

  location /docs {
    proxy_pass $api_backend;
  }

  # Always revalidate the application shell so a rebuilt container cannot keep
  # pointing browsers at an obsolete hashed JavaScript or stylesheet bundle.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /index.html =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
