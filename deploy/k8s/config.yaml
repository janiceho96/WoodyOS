apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-nexus-config
  namespace: ai-nexus
data:
  NODE_ENV: production
  PORT: "3001"
  EXTRACTOR_URL: http://extractor:8000
  LLM_PROVIDER: anthropic
  LLM_BASE_URL: ""
  LLM_DEFAULT_MODEL: claude-sonnet-4-20250514
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-nexus-secrets
  namespace: ai-nexus
type: Opaque
stringData:
  DATABASE_URL: replace-me
  REDIS_URL: replace-me
  JWT_SECRET: replace-with-a-strong-random-secret
  ENCRYPTION_KEY: replace-with-a-base64-encoded-32-byte-key
  ANTHROPIC_API_KEY: replace-me
  LLM_API_KEY: ""
  EXTRACTOR_TOKEN: replace-me
  EMBEDDING_API_URL: ""
  EMBEDDING_API_KEY: ""
