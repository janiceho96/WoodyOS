apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-nexus
spec:
  replicas: 2
  selector: { matchLabels: { app: ai-nexus-api } }
  template:
    metadata: { labels: { app: ai-nexus-api } }
    spec:
      containers:
        - name: api
          image: your-registry/ai-nexus-api:latest
          ports: [{ containerPort: 3001 }]
          envFrom: [{ configMapRef: { name: ai-nexus-config } }, { secretRef: { name: ai-nexus-secrets } }]
          readinessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: ai-nexus }
spec:
  selector: { app: ai-nexus-api }
  ports: [{ port: 80, targetPort: 3001 }]
